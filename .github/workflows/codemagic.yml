workflows:
  android-workflow:
    name: Soft Keeper Android APK
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - motloungtlou9@gmail.com
        notify:
          success: true
          failure: true
